<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <!-- 品牌渐变锁定：蓝 2563EB 到 靛 4F46E5（tokens.css 品牌渐变） -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#brand)"/>
  <!-- 网格：极淡，增加质感不抢眼 -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 120H480M0 240H480M0 360H480M120 0V480M240 0V480M360 0V480"/>
  </g>
  <!-- 中心品牌方标：白底蓝字「链」 -->
  <rect x="196" y="84" width="88" height="88" rx="20" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="240" y="145" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">链</text>
  <!-- 站名 -->
  <text x="240" y="255" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">链付收银博客</text>
  <!-- 定位副标题 -->
  <text x="240" y="305" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#E0E7FF" text-anchor="middle">记录商业 SaaS 的实践与思考</text>
  <!-- 分隔线 -->
  <line x1="180" y1="348" x2="300" y2="348" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  <!-- 域名 -->
  <text x="240" y="392" font-family="SFMono-Regular, Consolas, monospace" font-size="19" fill="#C7D2FE" text-anchor="middle">blog.jiangzi.xin</text>
</svg>
